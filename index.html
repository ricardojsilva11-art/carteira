<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteira</title>
<meta name="theme-color" content="#080A09" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carteira">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   CARTEIRA — Premium Finance design system (v2)
   As classes antigas mantêm-se: todas as páginas herdam o aspeto novo.
   ============================================================ */
:root{
  --bg:#080A09; --bg2:#0D100E; --side:#0B0E0C; --card:#111513; --card2:#171C19; --card3:#1D231F; --line:#1E2521; --line2:#2A332D;
  --txt:#F1F7F3; --txt2:#BFD3C6; --txt3:#86A190; --acc:#22C55E; --acc-btn:#22C55E; --acc-ink:#03140A; --acc-soft:rgba(34,197,94,.12);
  --gold:#E3B341; --gold-soft:rgba(227,179,65,.13);
  --up:#22C55E; --down:#F87171; --warn-bg:#211C0F; --warn:#E9C98A; --up-bg:rgba(34,197,94,.13); --down-bg:rgba(248,113,113,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --hero:linear-gradient(135deg,#131915 0%,#0F1311 100%);
  --r-lg:16px; --r-md:12px; --r-sm:10px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F6F4; --bg2:#ECF1EE; --side:#FFFFFF; --card:#FFFFFF; --card2:#F1F5F2; --card3:#E6EDE8; --line:#E1E8E3; --line2:#C9D5CD;
  --txt:#0B1A11; --txt2:#2F4A39; --txt3:#557060; --acc:#15803D; --acc-btn:#16A34A; --acc-ink:#FFFFFF; --acc-soft:rgba(22,163,74,.1);
  --gold:#9A6B00; --gold-soft:rgba(154,107,0,.1);
  --up:#15803D; --down:#DC2626; --warn-bg:#FFF6E5; --warn:#8A4B00; --up-bg:#E3F5E9; --down-bg:#FDECEC;
  --shadow:0 1px 2px rgba(10,30,20,.05), 0 6px 18px rgba(10,30,20,.05); --shadow-lg:0 24px 60px rgba(10,30,20,.18);
  --hero:linear-gradient(135deg,#FFFFFF 0%,#F5F9F6 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100vh;font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--txt3)} .muted2{color:var(--txt2)} .gold{color:var(--gold)}
.app{display:block;min-height:100vh}

/* ---------- menu lateral ---------- */
.side{width:256px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .22s ease,padding .22s ease}
.brand{display:flex;align-items:center;gap:12px;padding:2px 10px 24px}
.brand i{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(214,181,109,.28)}
.brand .lbl{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:.18em}
.brand small{font-size:11px;color:var(--txt3);letter-spacing:.02em;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);opacity:.8;padding:14px 12px 6px}
.nav .grp:first-child{padding-top:0}
.nav a{position:relative;display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:10px;color:var(--txt2);text-decoration:none;font-size:14px;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{color:var(--txt);background:var(--card2)}
.nav a.on{background:var(--acc-soft);color:var(--txt);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.nav a.on svg.i{color:var(--acc)}
.side .foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--txt3);font-size:12px;line-height:1.55}
main{min-width:0;padding:26px 32px 64px;max-width:1480px;margin:0 auto;width:100%}
main.pg-in{animation:pgin .26s ease both}
@keyframes pgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main.pg-in{animation:none}*{transition:none!important}}

/* barra de cima */
.top{position:sticky;top:0;z-index:45;background:color-mix(in srgb,var(--side) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;gap:18px}
.top .brand{padding:0;flex:none}
.top .brand i{width:32px;height:32px;border-radius:10px;color:var(--acc);background:var(--acc-soft);border:1px solid rgba(34,197,94,.25)}
.top .brand b{font-size:14px;letter-spacing:.16em}
.tnav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tnav::-webkit-scrollbar{display:none}
.tnav a,.tnav summary{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;color:var(--txt2);text-decoration:none;font-size:13.5px;font-weight:550;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s;list-style:none}
.tnav summary::-webkit-details-marker{display:none}
.tnav a:hover,.tnav summary:hover{color:var(--txt);background:var(--card2)}
.tnav a.on,.tnav details.on>summary{background:var(--acc-soft);color:var(--acc);font-weight:650}
.tnav svg.i{width:15px;height:15px}
.navmore{position:static}
.navmore .dd{position:absolute;top:58px;min-width:230px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:2px;z-index:50}
.navmore .dd a{border-radius:10px;justify-content:flex-start;height:40px}
.tact{display:flex;align-items:center;gap:8px;flex:none}
.tsearch{position:relative;width:220px}
.tsearch input.in{height:38px;min-height:38px;border-radius:999px;padding-left:36px;font-size:13.5px;background:var(--card)}
.tsearch>svg.i{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--txt3);pointer-events:none}
.tsearch .results{position:absolute;right:0;top:46px;width:320px;background:var(--card);box-shadow:var(--shadow-lg);z-index:50}
.tbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex:none}
.tbtn:hover{color:var(--txt);border-color:var(--line2)}
.tbtn.on{color:var(--acc);border-color:var(--acc)}
.tbtn svg.i{width:17px;height:17px}
.tstat{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--txt3);line-height:1.3;white-space:nowrap}
.tstat .status{font-size:11.5px}
@media (max-width:1560px){.top .brand small{display:none}}
@media (max-width:1380px){.tstat{display:none}.tsearch{width:170px}}
@media (max-width:1180px){.tnav svg.i{display:none}}
@media (max-width:1080px){.tsearch{display:none}}
@media (max-width:900px){.top{display:none}}
/* cartões de indicadores (estilo novo) */
.kx{display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px}
.kx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kx-top .lab{font-size:13px;color:var(--txt2)}
.kx-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.kx-ico svg.i{width:18px;height:18px}
.kx-ico.g{background:rgba(34,197,94,.14);color:#22C55E}.kx-ico.b{background:rgba(59,130,246,.15);color:#60A5FA}.kx-ico.p{background:rgba(168,85,247,.15);color:#C084FC}.kx-ico.y{background:rgba(234,179,8,.15);color:#FACC15}
.kx-v{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kx-c{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px}
.chgx{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650}
.chgx svg.i{width:14px;height:14px}
@media (max-width:600px){.kx-v{font-size:21px}.kx{padding:14px}.kx-ico{width:30px;height:30px}}
select.in.sel-sm{min-height:34px;height:34px;width:auto;padding:0 30px 0 12px;font-size:13px;border-radius:10px;background:var(--card2)}
/* faixa com os ativos */
.watch{display:flex;gap:12px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;scroll-snap-type:x proximity}
.wcard{flex:0 0 250px;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:inherit;font:inherit;cursor:pointer;text-align:left;scroll-snap-align:start;transition:border-color .15s}
.wcard:hover{border-color:var(--line2)}
.wcard .wi{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.wcard .wi .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wp{font-size:12.5px;display:flex;gap:6px;margin-top:3px;white-space:nowrap}
.wcard .wsp{width:74px;height:36px;flex:none}
/* listas compactas */
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lst li{display:flex;align-items:center;gap:11px;padding:10px 4px;border-top:1px solid var(--line);font-size:13.5px}
.lst li:first-child{border-top:0}
.lst li.click{cursor:pointer;border-radius:8px}.lst li.click:hover{background:var(--card2)}
.lst .li-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lst .li-m .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evd{width:40px;height:40px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.evd b{font-size:15px}.evd span{font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
/* barra inferior e folha «Mais» (telemóvel) */
.tabbar{display:none}
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .bk{position:absolute;inset:0;background:rgba(2,6,23,.55);animation:fd .2s ease}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;background:var(--side);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));animation:su .24s ease;max-height:80vh;overflow-y:auto}
.sheet .pn .hd{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:2px auto 12px}
.sheet .sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet .sgrid a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--txt2);text-decoration:none;font-size:12.5px;font-weight:500;text-align:center;padding:8px}
.sheet .sgrid a.on{border-color:var(--acc);color:var(--txt)}
.sheet .sgrid svg.i{width:22px;height:22px}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (max-width:900px){
  .side{display:none}
  main{padding:calc(14px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
  .tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:40;background:color-mix(in srgb,var(--side) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:6px 4px;justify-content:space-around;box-shadow:var(--shadow-lg)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;flex:1;min-height:50px;color:var(--txt3);text-decoration:none;font-size:10.5px;font-weight:500;border:0;background:transparent;border-radius:14px;cursor:pointer}
  .tabbar a.on,.tabbar button.on{color:var(--txt);font-weight:600}
  .tabbar a.on svg.i,.tabbar button.on svg.i{color:var(--acc)}
}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar svg.i{width:22px;height:22px}

/* ---------- blocos ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.025em;color:var(--acc)}
.head .eyebrow{display:block;font-size:12.5px;color:var(--txt3);margin-bottom:4px;font-weight:500}
.big{font-size:46px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
@media (max-width:600px){.big{font-size:34px}.head h1{font-size:22px}}
.row{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.g-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
.g-half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px;align-items:start}
@media (max-width:1100px){.g-main{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-half{grid-template-columns:1fr}}
@media (max-width:600px){.kpi .v{font-size:18px}.card{padding:16px}.grid3{grid-template-columns:1fr}.grid4{gap:10px}}
.g-main>*,.g-half>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 14px;font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--acc)}
.card .lab{font-size:12.5px;color:var(--txt3);font-weight:500}
a.card{transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--line2)}
.kpi{display:flex;flex-direction:column;gap:6px;position:relative}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.02em}
.kpi .ico{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--txt3)}
.kpi .ico svg.i{width:16px;height:16px}
.kpi .ico.up{background:var(--up-bg);color:var(--up)} .kpi .ico.down{background:var(--down-bg);color:var(--down)} .kpi .ico.acc{background:var(--acc-soft);color:var(--acc)} .kpi .ico.gold{background:var(--gold-soft);color:var(--gold)}
.f2{flex:2 1 520px}.f1{flex:1 1 300px}
.kpis4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.kpis4>div{display:flex;flex-direction:column;gap:3px}.kpis4 .lab{font-size:12px;color:var(--txt3)}.kpis4 .v{font-size:18px;font-weight:650}

/* cartão de destaque: património */
.hero{background:var(--hero);border:1px solid var(--line);border-radius:22px;padding:26px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:16px}
.hero::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(214,181,109,.45),transparent)}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero .eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.hero .valor{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:10px 0 4px}
.hero .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.hero .stats>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero .stats .lab{font-size:12px;color:var(--txt3)} .hero .stats .v{font-size:18px;font-weight:650}
.hero .spark{position:absolute;right:28px;bottom:94px;width:min(38%,380px);height:70px;opacity:.9;pointer-events:none}
@media (max-width:900px){.hero .spark{display:none}.hero .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px}}
.chg{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13.5px;font-weight:600}
.chg.up{background:var(--up-bg)} .chg.down{background:var(--down-bg)} .chg:not(.up):not(.down){background:var(--card2);color:var(--txt2)}

.btn{min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:550;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap;color:var(--txt);text-decoration:none;transition:background .15s,border-color .15s,transform .08s,filter .15s}
.btn:hover{background:var(--card2);border-color:var(--line2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc-btn);color:var(--acc-ink);border-color:transparent;font-weight:650;box-shadow:0 6px 18px rgba(34,197,94,.22)}
.btn.pri:hover{filter:brightness(1.08);background:var(--acc-btn)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--txt2)} .btn.ghost:hover{background:var(--card2);color:var(--txt)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 40%,transparent)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.ic{width:42px;padding:0}
.btn[disabled]{opacity:.55;cursor:default}
.seg{display:inline-flex;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;flex-wrap:wrap}
.seg button{min-height:32px;padding:0 11px;border:none;border-radius:8px;background:transparent;color:var(--txt3);cursor:pointer;font-size:12.5px;font-weight:550;transition:background .15s,color .15s}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--card3);color:var(--txt);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--txt2);font-size:12px;font-weight:550;white-space:nowrap}
.pill.up{background:var(--up-bg);color:var(--up)} .pill.down{background:var(--down-bg);color:var(--down)} .pill.acc{background:var(--acc-soft);color:var(--acc)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.warn{padding:11px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;line-height:1.5;margin-top:10px;border:1px solid color-mix(in srgb,var(--warn) 20%,transparent)}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.legend li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.legend li span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--txt3);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer;transition:background .12s} tr.click:hover td{background:var(--card2)}
.tk{font-weight:650}.sub{font-size:12px;color:var(--txt3)}
.logo{width:34px;height:34px;border-radius:10px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;letter-spacing:-.02em;color:#fff}
.atv{display:flex;align-items:center;gap:11px;min-width:150px}
.atv>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.atv .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.presumo{line-height:1.6;margin:10px 0;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 20px;margin-top:6px}
.pc .pt,.psug .pt{font-size:11.5px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 4px}
.pc ul{margin:0;padding:0;list-style:none}.pc li{font-size:14px;line-height:1.55;padding:6px 0;border-top:1px solid var(--line)}.pc li:first-child{border-top:0}
.psug{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg2);font-size:14.5px;line-height:1.55}
.tfr{display:inline-block;font-size:10.5px;font-weight:600;line-height:1;padding:3px 6px;margin:0 6px 1px 0;border-radius:999px;border:1px solid var(--c);color:var(--txt2);vertical-align:1px;white-space:nowrap}
.ficha{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}.ficha .fl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.ficha .fl>span:last-child{text-align:right}
@media (max-width:600px){.ficha{grid-template-columns:1fr}}
th.ord button{all:unset;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit}th.ord button:hover{color:var(--txt)}th.ord button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
th[aria-sort="ascending"],th[aria-sort="descending"]{color:var(--txt)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:var(--card2)}
.prog{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#15803D,var(--acc))}
.prog.gold>i{background:linear-gradient(90deg,#B8964F,var(--gold))}
.prog.up>i{background:linear-gradient(90deg,#059669,var(--up))}
.empty{text-align:center;padding:44px 20px;color:var(--txt2)}
.empty h2{color:var(--txt);font-size:18px}
.empty .eico{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:var(--acc-soft);color:var(--acc)}
.empty .eico svg.i{width:26px;height:26px}
.chartbox{position:relative;width:100%}
details.mais{margin-top:4px}

/* carregamento e dicas */
.skel{background:linear-gradient(90deg,var(--card2) 25%,var(--card3) 37%,var(--card2) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.tip{position:relative;display:inline-flex;width:16px;height:16px;border-radius:50%;border:1px solid var(--line2);color:var(--txt3);font-size:10px;font-weight:700;align-items:center;justify-content:center;cursor:help;vertical-align:-3px;margin-left:4px;font-style:normal;flex:none}
.tip::after{content:attr(data-tip);position:absolute;z-index:30;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);width:max-content;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--card3);border:1px solid var(--line2);color:var(--txt);font-size:12.5px;font-weight:450;line-height:1.45;text-transform:none;letter-spacing:0;white-space:normal;text-align:left;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.tip:hover::after,.tip:focus::after{opacity:1;transform:translateX(-50%)}
.kpi .tip::after{left:auto;right:-10px;transform:translateY(4px)}
.kpi .tip:hover::after,.kpi .tip:focus::after{transform:none}

/* privacidade: esconder valores */
body.privado .mono:not(input):not(.nopriv),body.privado .priv,body.privado .kpi .sub,body.privado .metrics .sub,body.privado .kpis4 .sub,body.privado .ficha .sub,body.privado .hero .stats .v{filter:blur(8px);user-select:none}
body.privado canvas.privc{filter:blur(6px)}

/* janelas minimizáveis */
.cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cab>h2{margin:0!important;flex:1 1 auto}
.card>.cab{margin-bottom:14px}
.minbtn{width:32px;height:32px;flex:none;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--txt3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-left:auto}
.minbtn:hover{background:var(--card2);color:var(--txt)}
.minbtn svg{width:18px;height:18px;transition:transform .15s}
.card.min{padding-top:13px;padding-bottom:13px}
.card.min>:not(.cab){display:none!important}
.card.min>.cab{margin-bottom:0}
.card.min>.cab>:not(h2):not(.minbtn):not(.ai){display:none!important}
.card.min .minbtn svg{transform:rotate(-90deg)}
/* menu lateral recolhido */
body.menu-min .side{width:76px;padding:22px 12px 16px}
body.menu-min .side .lbl,body.menu-min .side .foot,body.menu-min .nav .grp{display:none}
body.menu-min .nav a{justify-content:center;padding:0}
body.menu-min .nav a.on::before{left:-12px}
body.menu-min .brand{justify-content:center;padding:2px 0 24px}
.recolher{display:flex;align-items:center;gap:12px;min-height:38px;padding:0 12px;border:none;border-radius:10px;background:transparent;color:var(--txt3);cursor:pointer;font-size:12.5px;margin-top:8px}
.recolher:hover{color:var(--txt);background:var(--card2)}
body.menu-min .recolher{justify-content:center;padding:0}
body.menu-min .recolher svg{transform:rotate(180deg)}
td.r.mono{white-space:nowrap}
@media (max-width:600px){table.curta .nm{display:none}table.curta{min-width:0!important}}
details.mais>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt2);font-size:13.5px;font-weight:550}
details.mais>summary:hover{color:var(--txt)}
details.mais>summary::-webkit-details-marker{display:none}
details.mais>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.mais[open]>summary::before{transform:rotate(45deg)}
.ai{display:flex;align-items:center;gap:8px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.06em}
.prose p{margin:0 0 10px;line-height:1.6;font-size:15px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.idea{display:flex;flex-direction:column;gap:10px}
.idea .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.conf{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--txt3)}
.conf .track{flex:1;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.conf .track span{display:block;height:100%;background:var(--acc)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.metrics div{background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:inset -1px -1px 0 var(--line);margin:0 -1px -1px 0}
.metrics .n{font-size:12px;color:var(--txt3)} .metrics .v{font-size:18px;font-weight:650;letter-spacing:-.015em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:13px;font-weight:550;color:var(--txt2);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.chip:hover{color:var(--txt);background:var(--card2)}
.chip.on{background:var(--acc-soft);color:var(--txt);border-color:var(--acc)}
.chip .n{font-size:11.5px;color:var(--txt3)}
.srcs{display:flex;flex-direction:column;gap:4px;font-size:13px}
.srcs a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* fichas de ativos */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;color:inherit;font:inherit;width:100%}
.acard:hover{border-color:var(--line2);transform:translateY(-1px)}
.acard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acard .sp{height:48px;width:100%}
.acard .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:13px}
.acard .kv>div{display:flex;justify-content:space-between;gap:8px}
.acard .kv>div>span:first-child{color:var(--txt3)}
/* filtros */
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.fbar label.f{flex:0 1 180px}
.fbar .grow{flex:1 1 240px}
.srch{position:relative}
.srch svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt3);width:16px;height:16px}
.srch input.in{padding-left:36px}
/* formulários e janelas */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--txt2);font-weight:500}
input.in,select.in,textarea.in{min-height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);font-size:15px;width:100%;transition:border-color .15s}
input.in:hover,select.in:hover{border-color:var(--txt3)}
textarea.in{padding:10px 12px;min-height:80px}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
@media (max-width:600px){input.in,select.in,textarea.in{font-size:16px}}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
dialog{border:1px solid var(--line);border-radius:20px;padding:0;background:var(--card);color:var(--txt);width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:var(--shadow-lg)}
dialog[open]{animation:dlgin .2s ease}
@keyframes dlgin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
dialog.wide{width:min(1060px,calc(100vw - 24px))}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:28px 16px;text-align:center;color:var(--txt2);cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;transition:border-color .15s,background .15s}
.drop.on,.drop:hover{border-color:var(--acc);background:var(--acc-soft)}
.imp td{padding:7px 5px;font-size:13.5px}
.imp input.in{min-height:36px;font-size:14px;padding:0 8px}
.imp tr.dup td{opacity:.55}
dialog::backdrop{background:rgba(2,6,23,.6);backdrop-filter:blur(3px)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:19px;letter-spacing:-.015em}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:260px;overflow-y:auto}
.results button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:10px 12px;min-height:48px;border:none;border-top:1px solid var(--line);background:transparent;cursor:pointer}
.results button:first-child{border-top:none}
.results button:hover,.results button:focus{background:var(--card2)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(6px);background:var(--card3);color:var(--txt);border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:calc(100vw - 32px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (min-width:901px){.toast{bottom:28px}}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.setgrid label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.setgrid input{width:64px;min-height:34px;padding:0 6px;border-radius:7px;border:1px solid var(--line2);background:var(--card);color:var(--txt);text-align:right}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt3)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--txt3);flex:none}
.status.ok i{background:var(--up);box-shadow:0 0 0 3px var(--up-bg)} .status.bad i{background:var(--down);box-shadow:0 0 0 3px var(--down-bg)} .status.wait i{background:var(--gold)}
.hrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:600px){
  .head{align-items:flex-start}
  .head>.hrow{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .head>.hrow::-webkit-scrollbar{display:none}
  .head>.hrow .btn{min-height:38px;flex:none}
  .head>.hrow .btn.pri{order:-1}
  .kpi .ico{display:none}
  .fbar label.f,.fbar .grow{flex:1 1 100%}
  .hero .valor{gap:10px}
}
.srch{display:block}
@media (min-width:901px){.btn.olho{display:none}}
.sec-t{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin:26px 0 12px}
</style>

const DEFAULT_SERVER = "https://carteira-api.ricardo-j-silva11.workers.dev";

const COR_TIPO = {"Ação":"#4FC1B0","ETF":"#6EA8FE","REIT":"#B48CF2","Cripto":"#F7931A","Obrigações":"#9DB4FF","Fundo":"#E8D36A"};
/* [id, nome, ícone, grupo] — «posicoes» é a Carteira (mantém o endereço antigo #posicoes) */
const VIEWS = [["painel","Painel","i-painel","p"],["posicoes","Carteira","i-pos","p"],["ativos","Ativos","i-ativos","p"],["movimentos","Movimentações","i-mov","p"],["dividendos","Dividendos","i-div","p"],
  ["analises","Análises","i-an","a"],["exposicao","Exposição e plano","i-exp","a"],["analise","Análise de ativos","i-act","a"],["sugestoes","Sugestões IA","i-ia","a"],["simuladores","Simuladores","i-calc","a"],["definicoes","Configurações","i-def","c"]];

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const hoje = () => new Intl.DateTimeFormat("en-CA", {timeZone:"Europe/Lisbon"}).format(new Date());
const nf = (d) => new Intl.NumberFormat("pt-PT", {minimumFractionDigits:d, maximumFractionDigits:d});
const NF2 = nf(2), NF1 = nf(1), NF0 = nf(0);
const eur = (v, d = 2) => (d === 2 ? NF2 : d === 0 ? NF0 : nf(d)).format(+v || 0) + " €";
const sgn = v => v > 0 ? "+" : v < 0 ? "−" : "";
const eurS = (v, d = 2) => sgn(v) + eur(Math.abs(v), d);
const pctS = v => isFinite(v) ? sgn(v) + NF1.format(Math.abs(v * 100)) + "%" : "—";

const tone = v => v > 0 ? "up" : v < 0 ? "down" : "";
const num = s => { const v = parseFloat(String(s == null ? "" : s).replace(/\s/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")); return isFinite(v) ? v : NaN; };
const fmtPreco = (v, moeda) => { if (v == null || !isFinite(v)) return "—"; const d = Math.abs(v) >= 1000 ? 2 : Math.abs(v) >= 1 ? 2 : 4; return nf(d).format(v) + " " + (moeda === "EUR" ? "€" : moeda === "USD" ? "$" : (moeda || "")); };

function toast(t, ms = 2600){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), ms); }
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
/* modo de teste (testes.html): memória própria, sem servidor e sem tocar nos dados guardados */
const TESTE = /[?&]teste\b/.test(location.search), MEM = {};
const store = TESTE ? { get(k, d){ return k in MEM ? JSON.parse(MEM[k]) : d; }, set(k, v){ MEM[k] = JSON.stringify(v); } } : {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- proteção dos dados (redesign v2) ---------- */
if (!TESTE) try{

    const c = {};
    for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith("cart.") && !k.startsWith("cart.backup") && k !== "cart.precos" && k !== "cart.longo") c[k] = localStorage.getItem(k); }
    if (Object.keys(c).length) localStorage.setItem("cart.backup.v2", JSON.stringify({quando:Date.now(), versao:"antes do redesign v2", chaves:c}));

}catch(e){}

/* ---------- estado ---------- */
let S = store.get("cart.state", null) || {v:1, cfg:{upd:0, perfil:"moderado", horizonte:"longo"}, ops:[], ativos:[], analises:[], sugestoes:null};
["ops","ativos","analises"].forEach(k => S[k] = S[k] || []);
let L = store.get("cart.local", {server:DEFAULT_SERVER, code:"", tema:"auto"});
let P = store.get("cart.precos", {precos:{}, fx:{EUR:{preco:1, hist:[]}}, quando:0, range:""});
let syncState = {ok:null, msg:"", quando:0};
const vivos = c => (S[c] || []).filter(x => x && !x.del);
const ativo = sym => vivos("ativos").find(a => a.id === sym);
/* corretora: «origem» do movimento (XTB, Revolut…); sem origem = «Manual» */
const corretoraDe = o => o.origem || "Manual";
let FILTRO = store.get("cart.filtro", "");
const opsF = () => vivos("ops").filter(o => !FILTRO || corretoraDe(o) === FILTRO);
const corretoras = () => [...new Set(vivos("ops").map(corretoraDe))].sort();
function setFiltro(c){ FILTRO = c; store.set("cart.filtro", c); render(); }
function chipsCorretora(){
  const cs = corretoras(); if (cs.length < 2) return "";
  return `<div class="chips" role="group" aria-label="Corretora" style="margin:-6px 0 16px">${[["", "Todas"]].concat(cs.map(c => [c, c])).map(([v, t]) => `<button type="button" class="chip ${FILTRO === v ? "on" : ""}" onclick="setFiltro('${esc(v)}')">${esc(t)}</button>`).join("")}</div>`;
}

function save(){ store.set("cart.state", S); scheduleSync(); }
function touch(o){ o.upd = Date.now(); return o; }
function upsert(col, obj){ touch(obj); if (!Array.isArray(S[col])) S[col] = []; const i = S[col].findIndex(x => x.id === obj.id); if (i >= 0) S[col][i] = Object.assign({}, S[col][i], obj); else S[col].push(obj); save(); }

/* ---------- tema ---------- */
function aplicarTema(){
  const t = L.tema === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : L.tema;
  document.documentElement.dataset.theme = t;
}
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (L.tema === "auto"){ aplicarTema(); render(); } });

/* ---------- servidor ---------- */
async function api(path, body, timeout = 90000){
  if (!L.server || !L.code) throw new Error("Configura o servidor e o código pessoal nas Configurações.");
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeout);
  try{
    const r = await fetch(L.server.replace(/\/+$/, "") + path, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(Object.assign({code:L.code}, body || {})), signal:ctl.signal});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ({524:"O servidor demorou demasiado a responder (limite da Cloudflare). Tenta outra vez.", 503:"O servidor ficou sem recursos (limite do plano da Cloudflare). Tenta outra vez daqui a pouco.", 502:"O servidor não conseguiu responder. Tenta outra vez."})[r.status] || ("Erro " + r.status));
    return j;
  }catch(e){
    if (e.name === "AbortError") throw new Error("O servidor demorou demasiado a responder.");
    if (e instanceof TypeError){
      /* distingue «sem internet / endereço errado» de «o servidor falhou neste pedido» */
      let vivo = false;
      try{ const c = new AbortController(); setTimeout(() => c.abort(), 8000); const g = await fetch(L.server.replace(/\/+$/, "") + "/", {signal:c.signal}); vivo = g.ok; }catch(x){}
      if (vivo) throw new Error("O servidor está ligado mas não conseguiu responder a este pedido (limite de processamento da Cloudflare). Tenta outra vez; se repetir, avisa.");
      throw new Error("Sem ligação ao servidor. Confirma a internet e o endereço do servidor nas Configurações.");
    }
    throw e;
  }finally{ clearTimeout(t); }
}
let syncTimer = null, syncing = false, syncAgain = false;
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, 900); }
async function sync(){
  if (!L.server || !L.code) { syncState = {ok:null, msg:"Sem sincronização", quando:0}; footer(); return false; }
  if (syncing){ syncAgain = true; return; }
  syncing = true;
  try{
    const antes = JSON.stringify(S);
    const j = await api("/api/sync", {data:S}, 30000);
    if (j.data){ S = Object.assign({v:1, cfg:{upd:0}, ops:[], ativos:[], analises:[], sugestoes:null}, j.data); store.set("cart.state", S); }
    syncState = {ok:true, msg:"Sincronizado", quando:Date.now()};
    if (JSON.stringify(S) !== antes) renderBg();
    footer();
    return true;
  }catch(e){ syncState = {ok:false, msg:e.message, quando:Date.now()}; footer(); return false; }
  finally{ syncing = false; if (syncAgain){ syncAgain = false; scheduleSync(); } }
}

/* ---------- preços ---------- */
let loadingPrecos = false;
function rangeNecessario(){
  const d = vivos("ops").map(o => o.data).sort()[0];
  if (!d) return "1y";
  const anos = (Date.now() - new Date(d).getTime()) / (365.25 * 864e5);
  return anos <= .9 ? "1y" : anos <= 1.9 ? "2y" : anos <= 4.8 ? "5y" : anos <= 9.6 ? "10y" : "max";
}
async function atualizarPrecos(forcar){
  const syms = [...new Set(vivos("ops").map(o => o.sym).filter(Boolean).concat(benchSym() ? [benchSym()] : []))];
  if (!syms.length || loadingPrecos) return;
  const range = rangeNecessario();
  if (!forcar && P.range === range && Date.now() - P.quando < 4 * 60e3 && syms.every(s => P.precos[s])) return;
  loadingPrecos = true; footer();
  try{
    const j = await api("/api/precos", {symbols:syms, range});
    P = {precos:Object.assign({}, P.precos, j.precos), fx:Object.assign({}, P.fx, j.fx), quando:j.quando || Date.now(), range};
    store.set("cart.precos", P);
    clearTimeout(window._diaT); window._diaT = setTimeout(atualizarDia, 1500);
    const errs = Object.entries(j.erros || {});
    if (errs.length) toast("Sem preço para: " + errs.map(e => e[0]).join(", "), 4500);
    renderBg();
  }catch(e){ if (forcar) toast(e.message, 4500); }
  finally{ loadingPrecos = false; footer(); }
}
const moedaFx = m => m === "GBp" || m === "GBX" ? "GBP" : (m || "EUR");
const escalaMoeda = m => m === "GBp" || m === "GBX" ? .01 : 1;
function fxAgora(moeda){ const c = moedaFx(moeda); return c === "EUR" ? 1 : ((P.fx[c] || {}).preco || NaN); }
/* preço desatualizado: mais de 2 dias úteis sem cotação (cripto: mais de 1 dia) */
function precoVelho(sym){
  const pr = P.precos[sym]; if (!pr || !pr.dia) return "";
  const cripto = /-USD$|-EUR$/.test(sym) || (ativo(sym) || {}).tipo === "Cripto";
  let n = 0; const d = new Date(pr.dia + "T12:00:00Z"), fim = new Date(hoje() + "T12:00:00Z");
  while (d < fim && n < 10){ d.setUTCDate(d.getUTCDate() + 1); const w = d.getUTCDay(); if (cripto || (w > 0 && w < 6)) n++; }
  return n > (cripto ? 1 : 2) ? pr.dia : "";
}
function precoEUR(sym){ const p = P.precos[sym]; if (!p) return NaN; return p.preco * escalaMoeda(p.moeda) * fxAgora(p.moeda); }

/* ---------- cálculos da carteira ---------- */
/* ---------- CÁLCULOS ----------
   Método FIFO (as primeiras unidades compradas são as primeiras vendidas), como no IRS.
   Valores em euros: o custo é o total pago no dia (com comissões); a venda é o total recebido (já sem comissões).
   Comissões e impostos avulsos (tipo «comissao»/«imposto») são custos que reduzem o resultado total. */
const TIPOS_CAPITAL = ["compra", "venda"], TIPOS_CUSTO = ["comissao", "imposto"];
function posicoes(){
  const by = {}, novo = sym => by[sym] = by[sym] || {sym, qtd:0, custo:0, realizado:0, divRec:0, divImp:0, custos:0, compras:0, receitas:0, lotes:[], vendasCasadas:[], ops:[]};
  opsF().slice().sort((a, b) => (a.data || "").localeCompare(b.data || "") || (a.criado || 0) - (b.criado || 0)).forEach(o => {
    if (!o.sym) return;   /* custos sem ativo: só entram nos totais */
    const p = novo(o.sym), q = +o.qtd || 0, t = +o.total || 0;
    p.ops.push(o);
    if (o.tipo === "dividendo"){ p.divRec += t; p.divImp += +o.imposto || 0; return; }
    if (TIPOS_CUSTO.includes(o.tipo)){ p.custos += t; return; }
    if (o.tipo === "venda"){
      let falta = Math.min(q, p.qtd), custoSaiu = 0;
      const casada = falta;
      while (falta > 1e-12 && p.lotes.length){
        const l = p.lotes[0], usa = Math.min(falta, l.qtd), c = l.custo * usa / l.qtd;
        custoSaiu += c; l.custo -= c; l.qtd -= usa; falta -= usa;
        if (l.qtd < 1e-12) p.lotes.shift();
      }
      if (q - casada > 1e-6) (p.semCompra = p.semCompra || []).push({data:o.data, qtd:+(q - casada).toFixed(6)});
      const receita = q > 0 ? t * casada / q : 0;     /* só a parte com compra registada */
      p.realizado += receita - custoSaiu; p.receitas += receita;
      if (receita > 0) p.vendasCasadas.push({id:o.id, data:o.data, receita, custo:custoSaiu});
      p.qtd -= casada;
      if (p.qtd < 1e-9){ p.qtd = 0; p.lotes = []; }
    } else if (o.tipo === "compra"){ p.qtd += q; p.compras += t; if (q > 0) p.lotes.push({qtd:q, custo:t, data:o.data}); }
    p.custo = p.lotes.reduce((s, l) => s + l.custo, 0);
  });
  return Object.values(by).map(p => {
    const a = ativo(p.sym) || {}, pr = P.precos[p.sym] || {};
    const unit = precoEUR(p.sym);
    const valor = p.qtd * unit;
    const varDia = pr.preco && pr.anterior ? p.qtd * (pr.preco - pr.anterior) * escalaMoeda(pr.moeda) * fxAgora(pr.moeda) : 0;
    const dps12 = dps12m(p.sym), escFx = escalaMoeda(pr.moeda) * fxAgora(pr.moeda);
    const divPrev = p.qtd * dps12 * escFx;
    return Object.assign(p, {sessao:pr.sessao || "", divPrev:isFinite(divPrev) ? divPrev : 0, nome:a.nome || pr.nome || p.sym, tipo:a.tipo || "Ação", setores:a.setores || {"Outros":100}, moeda:pr.moeda || a.moeda || "", precoLocal:pr.preco,
      precoMedio:p.qtd > 0 ? p.custo / p.qtd : 0, valor, ganho:valor - p.custo, rend:p.custo > 0 ? (valor - p.custo) / p.custo : 0, varDia, varDiaPct:pr.anterior ? pr.preco / pr.anterior - 1 : 0, temPreco:isFinite(valor)});
  });
}
/* indicadores da carteira — cada um com o seu significado (ver «Como são calculados» na app) */
function totais(ps){
  const ab = ps.filter(p => p.qtd > 0);
  const valor = ab.reduce((s, p) => s + (p.temPreco ? p.valor : p.custo), 0);
  const custo = ab.reduce((s, p) => s + p.custo, 0);                          /* custo (FIFO) das posições abertas */
  const realizado = ps.reduce((s, p) => s + p.realizado, 0);                  /* vendas − custo das unidades vendidas */
  const dia = ab.reduce((s, p) => s + (p.temPreco ? p.varDia : 0), 0);
  const divRec = ps.reduce((s, p) => s + p.divRec, 0), divImp = ps.reduce((s, p) => s + p.divImp, 0), divPrev = ab.reduce((s, p) => s + p.divPrev, 0);
  const capitalBruto = ps.reduce((s, p) => s + p.compras, 0);                 /* tudo o que pagaste em compras */
  const receitas = ps.reduce((s, p) => s + p.receitas, 0);                    /* o que recebeste em vendas (com compra registada) */
  const custosAvulsos = opsF().filter(o => TIPOS_CUSTO.includes(o.tipo)).reduce((s, o) => s + (+o.total || 0), 0);
  const lim = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10);
  const div12 = opsF().filter(o => o.tipo === "dividendo" && o.data >= lim).reduce((s, o) => s + (+o.total || 0), 0);
  const naoRealizado = valor - custo, total = naoRealizado + realizado + divRec - custosAvulsos;

function ativarMinimizar(root){
  const fech = store.get("cart.min", {});
  root.querySelectorAll(".card").forEach(card => {
    if (card.tagName === "A" || card.dataset.minok) return;
    /* o título é o primeiro elemento do cartão: um h2, ou a barra de cima que contém o h2 */
    const p1 = card.firstElementChild; if (!p1) return;
    let h2, cab;
    if (p1.tagName === "H2"){ h2 = p1; cab = document.createElement("div"); cab.className = "cab"; card.insertBefore(cab, h2); cab.appendChild(h2); }
    else if (p1.tagName === "DIV" && p1.querySelector(":scope > h2, :scope > .ai")){ cab = p1; cab.classList.add("cab"); h2 = p1.querySelector(":scope > h2") || p1.querySelector(":scope > .ai"); }
    else return;
    const titulo = h2.textContent.trim(), k = chaveJanela(titulo);
    card.dataset.minok = 1;
    const b = document.createElement("button");
    b.type = "button"; b.className = "minbtn"; b.innerHTML = '<svg class="i"><use href="#i-chev"/></svg>';
    const aplicar = min => { card.classList.toggle("min", min); b.setAttribute("aria-expanded", String(!min)); b.setAttribute("aria-label", (min ? "Mostrar " : "Minimizar ") + "«" + titulo + "»"); b.title = min ? "Mostrar" : "Minimizar"; };
    b.onclick = () => { const f = store.get("cart.min", {}), min = !card.classList.contains("min"); if (min) f[k] = 1; else delete f[k]; store.set("cart.min", f); aplicar(min); if (!min) setTimeout(() => Object.values(charts).forEach(c => c.resize()), 30); };
    cab.appendChild(b); aplicar(!!fech[k]);
  });
}

async function ficheiroParaEnvio(f){

  if (f.size > 15 * 1024 * 1024) throw new Error(`${nome}: ficheiro demasiado grande (máximo 15 MB).`);
  if (["csv","txt","tsv"].includes(ext) || /^text\//.test(f.type)) return {nome, texto:limparTexto(await textoDe(f))};

    return {nome, texto:limparTexto(wb.SheetNames.map(n => `### Folha: ${n}\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n], {dateNF:"yyyy-mm-dd"})).join("\n\n"))};

function eventosCal(dias){

  const ps = posicoes().filter(p => p.qtd > 0);
  Object.values(CAL.cal || {}).forEach(c => {

      const v = p.qtd * d.valor * escalaMoeda(c.moeda || p.moeda) * fxAgora(c.moeda || p.moeda);
      if (d.ex >= hojeD && d.ex <= fim) out.push({data:d.ex, sym:c.sym, tipo:"ex", txt:`Data ex-dividendo${d.estimado ? " (estimada)" : ""}`, valor:v, est:d.estimado});

    });
    (c.resultados || []).forEach(d => { if (d >= hojeD && d <= fim) out.push({data:d, sym:c.sym, tipo:"res", txt:p ? "Resultados trimestrais" : "Resultados trimestrais (a seguir)"}); });

function listaAvisos(ps){
  const out = [], hojeD = hoje();
  duplicadosProvaveis().forEach(o => out.push({id:"dup:" + o.id, txt:`<strong>${esc(o.sym)}:</strong> a compra de ${String(o.qtd).replace(".", ",")} unidades de ${dataPT(o.data)} (adicionada à mão) parece repetir uma compra importada. Se for a mesma, apaga-a.`, btn:`<button class="btn sm" onclick="abrirOp('${o.id}')">Ver e apagar</button>`}));
  ps.filter(p => p.semCompra).forEach(p => out.push({id:"semcompra:" + p.sym + ":" + p.semCompra.map(x => x.data + "/" + x.qtd).join(","), txt:`<strong>${esc(p.sym)}:</strong> ${p.semCompra.map(x => `venda de ${String(x.qtd).replace(".", ",")} unidades em ${dataPT(x.data)}`).join(", ")} sem compra registada antes. Falta o extrato mais antigo com essa compra; até lá, o ganho dessa venda não entra nas contas.`, btn:`<button class="btn sm" onclick="abrirImport()">Importar extrato</button>`}));
  ps.filter(p => p.qtd > 0 && !p.temPreco).forEach(p => out.push({id:"sempreco:" + p.sym, txt:`<strong>${esc(p.sym)}:</strong> sem preço de mercado. Confirma o símbolo (por exemplo, a bolsa certa).`, btn:`<button class="btn sm" onclick="verAtivo('${esc(p.sym)}')">Ver</button>`}));
  const lim = new Date(Date.now() - 45 * 864e5).toISOString().slice(0, 10);
  const porReg = pagamentos().filter(x => !x.registado && x.data < lim && x.data >= new Date(Date.now() - 400 * 864e5).toISOString().slice(0, 10));
  if (porReg.length) out.push({id:"divreg:" + porReg.length + ":" + porReg[0].data, txt:`${porReg.length} dividendo${porReg.length > 1 ? "s" : ""} detetado${porReg.length > 1 ? "s" : ""} no histórico ainda por registar (desde ${dataPT(porReg[porReg.length - 1].data)}). Importa o extrato mais recente ou regista-os.`, btn:`<a class="btn sm" href="#dividendos">Ver</a>`});
  corretoras().filter(c => c !== "Manual").forEach(c => {
    const ult = vivos("ops").filter(o => corretoraDe(o) === c).map(o => o.data).sort().pop();
    const temAberta = (() => { const f0 = FILTRO; FILTRO = c; const r = posicoes().some(p => p.qtd > 0); FILTRO = f0; return r; })();
    if (ult && temAberta && ult < new Date(Date.now() - 40 * 864e5).toISOString().slice(0, 10)) out.push({id:"corretora:" + c + ":" + ult, txt:`Último movimento da <strong>${esc(c)}</strong> registado: ${dataPT(ult)}. Se compraste, vendeste ou recebeste dividendos depois, importa o extrato mais recente.`, btn:`<button class="btn sm" onclick="store.set('cart.corretora','${esc(c)}');abrirImport()">Importar</button>`});
  });
  const semCor = vivos("ops").filter(o => !o.origem).length;
  if (semCor) out.push({id:"semcor:" + semCor, txt:`${semCor} movimento${semCor > 1 ? "s" : ""} sem corretora. Indica a corretora para veres os valores separados.`, btn:`<a class="btn sm" href="#definicoes">Corretoras</a>`});
  ps.filter(p => p.qtd > 0 && (ativo(p.sym) || {}).fonte === "pendente").forEach(p => out.push({id:"setores:" + p.sym, txt:`<strong>${esc(p.sym)}:</strong> setores ainda por classificar.`, btn:`<button class="btn sm" onclick="reclassificar('${esc(p.sym)}')">Classificar</button>`}));
  /* avisos ignorados (guardados nas definições e sincronizados); se a situação mudar, o aviso volta a aparecer */
  const ign = avisosIgn();
  return out.filter(x => !x.id || !ign.includes(x.id));
}

function distItens(ps, dim){
  const ab = ps.filter(p => p.qtd > 0 && p.temPreco), tot = ab.reduce((s, p) => s + p.valor, 0) || 1, g = {};
  const add = (k, v, ga, cu, cor) => { const x = g[k] = g[k] || {k, v:0, ganho:0, custo:0, cor}; x.v += v; x.ganho += ga; x.custo += cu; };
  if (dim === "setor") exposicao(ps).setores.forEach(([k, w]) => add(k, w * tot, NaN, NaN, COR_SETOR[k]));
  else ab.forEach(p => { const k = dim === "ativo" ? p.sym : dim === "classe" ? p.tipo : moedaFx(p.moeda); add(k, p.valor, p.ganho, p.custo, dim === "classe" ? COR_TIPO[k] : dim === "moeda" ? COR_MOEDA[k] : null); if (dim === "ativo") g[k].nome = p.nome; });
  const arr = Object.values(g).sort((a, b) => b.v - a.v);
  arr.forEach((x, i) => { x.w = x.v / tot; x.rend = x.custo > 0 ? x.ganho / x.custo : NaN; if (!x.cor) x.cor = CORES_ATV[i % CORES_ATV.length]; });
  return {arr, tot};
}

function movFiltrados(){
  const q = MF.q.trim().toLowerCase();

/* ---------- ANÁLISES (do património) ---------- */
function vAnalises(m){
  if (!vivos("ops").length) return semDados(m);
  const ps = posicoes(), t = totais(ps), h = historico(), ab = ps.filter(p => p.qtd > 0 && p.temPreco).sort((a, b) => b.valor - a.valor), tot = ab.reduce((s, p) => s + p.valor, 0) || 1;
  const rTot = h.length > 1 ? twr(h) : NaN, tr = tir(), top5 = ab.slice(0, 5).reduce((s, p) => s + p.valor, 0) / tot, nEf = 1 / ab.reduce((s, p) => s + (p.valor / tot) ** 2, 0), ex = exposicao(ps);
  const per = ["1M","3M","6M","1A","3A","ALL"].map(k => { const hp = fatiaDias(h, PER_DIAS[k]); return [k, hp.length > 1 ? twr(hp) : NaN, ganhoPeriodo(hp), hp.length > 1 ? hp[0][0] : ""]; });
  const divA = ps.filter(p => p.divRec > 0).sort((a, b) => b.divRec - a.divRec);
  m.innerHTML = `<div class="head"><div><span class="eyebrow">Património</span><h1>Análises</h1></div><div class="hrow">${olhoBtn()}<a class="btn" href="#exposicao"><svg class="i"><use href="#i-exp"/></svg>Exposição e plano</a></div></div>
  ${chipsCorretora()}
  <div class="grid4">
    ${kpiCard({lab:"Rentabilidade global", ico:"i-pct", icoCls:tone(t.totalPct), v:pctS(t.totalPct), cls:tone(t.totalPct), tip:"Resultado total ÷ capital investido em compras.", cmp:`resultado <span class="mono ${tone(t.total)}">${eurS(t.total, 0)}</span>`})}
    ${kpiCard({lab:"TWR desde o início", ico:"i-an", icoCls:tone(rTot), v:pctS(rTot), cls:tone(rTot), tip:"Rentabilidade ponderada no tempo: o efeito das tuas escolhas, sem o efeito de quando entrou dinheiro."})}
    ${kpiCard({lab:"TIR anual", ico:"i-clock", icoCls:tone(tr), v:isFinite(tr) ? pctS(tr) : "—", cls:tone(tr), tip:"Rentabilidade anual do teu dinheiro, com as datas reais das entradas e saídas."})}
    ${kpiCard({lab:"Concentração · 5 maiores", ico:"i-target", icoCls:"gold", v:pct(top5), tip:"Peso das 5 maiores posições. «Posições efetivas» = 1 ÷ soma dos pesos ao quadrado: quantas posições iguais dariam a mesma diversificação.", cmp:isFinite(nEf) ? `${NF1.format(nEf)} posições efetivas de ${ab.length}` : ""})}
  </div>
  <div class="g-half">
    <div class="card" style="margin:0"><h2>Património vs. capital investido</h2><div class="chartbox" style="height:260px"><canvas id="cAnEv" class="privc" role="img" aria-label="Evolução do património e do capital investido desde o início"></canvas></div>
      <div style="display:flex;gap:18px;font-size:12.5px;color:var(--txt2);margin-top:10px;flex-wrap:wrap"><span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:3px;border-radius:2px;background:var(--acc)"></span>Património</span><span style="display:flex;align-items:center;gap:6px"><span style="width:14px;border-top:2px dashed var(--txt3)"></span>Capital investido (custo)</span></div></div>
    <div class="card" style="margin:0"><h2>Comparação de períodos</h2><div class="tbl"><table><thead><tr><th>Período</th><th class="r">TWR${tipI("Rentabilidade das escolhas no período, sem o efeito das entradas e saídas.")}</th><th class="r">Ganho de mercado</th><th class="r nm">Desde</th></tr></thead><tbody>
      ${per.map(([k, r, g, d]) => `<tr><td class="tk">${k === "ALL" ? "Desde o início" : k}</td><td class="r"><span class="pill ${tone(r)} mono">${pctS(r)}</span></td><td class="r mono ${tone(g)}">${isFinite(g) ? eurS(g) : "—"}</td><td class="r mono muted2 nm">${d ? dataPT(d) : "—"}</td></tr>`).join("")}</tbody></table></div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">Ganho de mercado = variação do valor menos o dinheiro que entrou ou saiu no período.</p></div>
  </div>
  <div class="g-half">
    <div class="card" style="margin:0"><h2>Rentabilidade por ativo</h2><div class="chartbox" style="height:${Math.max(180, ab.length * 34 + 40)}px"><canvas id="cAnRend" role="img" aria-label="Rentabilidade não realizada de cada posição"></canvas></div></div>
    <div class="card" style="margin:0"><h2>Concentração dos maiores investimentos</h2>
      <div style="display:flex;flex-direction:column;gap:12px">${ab.slice(0, 8).map((p, i) => { const w = p.valor / tot, cum = ab.slice(0, i + 1).reduce((s, x) => s + x.valor, 0) / tot; return `<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13px"><span style="display:flex;align-items:center;gap:8px">${logoAtv(p.sym)}<span class="tk">${esc(p.sym)}</span></span><span class="mono"><b>${pct(w)}</b> <span class="muted">· acumulado ${pct(cum)}</span></span></div><div class="prog ${w > .25 ? "gold" : ""}"><i style="width:${(w * 100).toFixed(1)}%"></i></div></div>`; }).join("")}</div>
      ${alertas(ex).length ? alertas(ex).map(a => `<div class="warn">${esc(a)}</div>`).join("") : ""}</div>
  </div>
  <div class="g-half">
    <div class="card" style="margin:0"><h2>Distribuição por classe de ativo</h2>${barraBloco(ex.tipos, COR_TIPO)}<h2 style="margin:22px 0 14px">Moeda de cotação</h2>${barraBloco(ex.moedas, COR_MOEDA)}</div>
    <div class="card" style="margin:0"><h2>Dividendos por ativo</h2>${divA.length ? `<ul class="legend">${divA.map(p => `<li><span>${logoAtv(p.sym)}<span class="tk">${esc(p.sym)}</span></span><span style="display:flex;gap:12px;align-items:baseline"><span class="sub">${t.divRec > 0 ? pct(p.divRec / t.divRec) : ""}</span><span class="mono up" style="font-weight:600">${eur(p.divRec)}</span></span></li>`).join("")}</ul>` : `<p class="muted" style="margin:0">Ainda não registaste dividendos.</p>`}</div>
  </div>`;
  if (h.length > 1){
    const o = baseOpts(), cor = cssv("--acc"), step = Math.max(1, Math.floor(h.length / 400)), hh = h.filter((_, i) => i % step === 0 || i === h.length - 1);
    o.scales.y.ticks.callback = v => NF0.format(v) + " €"; o.plugins.tooltip.callbacks = {label:c => ` ${c.dataset.label}: ${eur(c.parsed.y, 0)}`};
    mkChart("cAnEv", {type:"line", data:{labels:hh.map(x => lblData(x[0])), datasets:[{label:"Património", data:hh.map(x => +x[1].toFixed(2)), borderColor:cor, backgroundColor:gradFill(cor), fill:true, borderWidth:2, pointRadius:0, tension:.3},
      {label:"Capital investido", data:hh.map(x => +x[2].toFixed(2)), borderColor:cssv("--txt3"), borderDash:[5, 5], borderWidth:1.5, pointRadius:0, fill:false, stepped:true}]}, options:o});
  }
  if (ab.length){
    const ord = ab.slice().sort((a, b) => b.rend - a.rend), o = baseOpts({indexAxis:"y"});
    o.scales = {x:{grid:{color:cssv("--line")}, ticks:{color:cssv("--txt3"), callback:v => v + "%"}, border:{display:false}}, y:{grid:{display:false}, ticks:{color:cssv("--txt2")}, border:{display:false}}};
    o.plugins.tooltip.callbacks = {label:c => ` ${pctS(ord[c.dataIndex].rend)} · ${eurS(ord[c.dataIndex].ganho)}`};
    mkChart("cAnRend", {type:"bar", data:{labels:ord.map(p => p.sym), datasets:[{data:ord.map(p => +(p.rend * 100).toFixed(2)), backgroundColor:ord.map(p => (p.rend >= 0 ? cssv("--up") : cssv("--down")) + "CC"), borderRadius:5, maxBarThickness:20}]}, options:o});
  }
}

/* ---------- SIMULADORES ---------- */
function vSimuladores(m){
  if (!vivos("ops").length) return semDados(m);
  const ps = posicoes();
  m.innerHTML = `<div class="head"><div><span class="eyebrow">Planeamento</span><h1>Simuladores</h1></div><div class="hrow">${olhoBtn()}</div></div>
  ${chipsCorretora()}
  <div class="card" style="margin-bottom:16px;display:flex;gap:14px;align-items:flex-start"><span class="kpi" style="flex:none"><span class="ico acc" style="position:static"><svg class="i"><use href="#i-info"/></svg></span></span>
    <div class="muted2" style="font-size:13.5px;line-height:1.6"><b style="color:var(--txt)">Pressupostos.</b> As simulações partem da tua carteira de hoje e do histórico mensal de cada ativo (em euros, com dividendos). Os valores futuros estão em euros nominais, com a conversão para euros de hoje feita a uma inflação de 2% ao ano. Os cenários pessimista e otimista são os casos de 1 em 10 de uma simulação com milhares de percursos possíveis. É uma estimativa, não uma garantia.</div></div>
  ${projecaoBloco(ps)}
  ${fireBloco(projecao(ps))}`;
  desenharProj();
}

/* ---------- menu «Mais» no telemóvel ---------- */
function abrirMais(){ const s = $("#sheet"); $("#sheetGrid").innerHTML = VIEWS.filter(v => !ocultos().includes(v[0]) || VIEW === v[0]).map(v => `<a href="#${v[0]}" class="${VIEW === v[0] ? "on" : ""}" onclick="fecharMais()"><svg class="i"><use href="#${v[2]}"/></svg>${v[1]}</a>`).join(""); s.classList.add("on"); s.setAttribute("aria-hidden", "false"); }
function fecharMais(){ const s = $("#sheet"); s.classList.remove("on"); s.setAttribute("aria-hidden", "true"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharMais(); });

/* ---------- arranque ---------- */
aplicarTema(); ajustarPriv();
if (store.get("cart.menuMin", false)) document.body.classList.add("menu-min");
new MutationObserver(() => ativarMinimizar($("#main"))).observe($("#main"), {childList:true, subtree:true});
rota();
estadoNotif().then(() => { if (VIEW === "definicoes") render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistration("./").then(r => r && r.update()).catch(() => {});
if (L.code) sync().then(() => atualizarPrecos());
else if (!vivos("ops").length && !location.hash) location.hash = "#definicoes";
setInterval(() => { if (document.visibilityState === "visible"){ atualizarPrecos(); sync(); } }, 5 * 60e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && L.code){ sync(); atualizarPrecos(); } });
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(() => Object.values(charts).forEach(c => c.resize()), 150); });
/* modo de teste (index.html?teste=1): só memória, sem servidor; usado por testes.html */
if (TESTE) window._teste = {
  estado(s, p, filtro){ S = Object.assign({v:1, cfg:{upd:0}, ops:[], ativos:[], analises:[], sugestoes:null}, s); P = Object.assign({precos:{}, fx:{EUR:{preco:1, hist:[]}}, quando:Date.now(), range:""}, p); FILTRO = filtro || ""; PROJ_MEMO = {k:"", v:null}; },
  posicoes, totais, historico, twr, tir, deixaVendaSemUnidades, hoje
};
</script>
